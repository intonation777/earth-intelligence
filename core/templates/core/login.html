<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود | Earth Intelligence</title>
<style>
  body{margin:0;font-family:Tahoma,Vazirmatn,system-ui,sans-serif;background:#0B1B2B;color:#E8F0F5;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{width:min(430px,100%);background:#12293B;border:1px solid #24435C;border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .logo{font-size:2rem;text-align:center}.title{text-align:center;font-size:1.35rem;font-weight:800;margin:10px 0 4px}
  .sub{text-align:center;color:#9FB6C9;font-size:.9rem;margin-bottom:18px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;border:1px solid #2C5470;background:#0F2233;color:#DCE9F2;border-radius:12px;padding:10px;font-weight:700;cursor:pointer}
  .tabs button.on{background:#1D7A8C;border-color:#1D7A8C;color:#fff}
  input{width:100%;box-sizing:border-box;margin-bottom:10px;border:1px solid #2C5470;background:#0A1826;color:#E8F0F5;border-radius:12px;padding:12px;font-size:1rem}
  .btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:1rem;cursor:pointer;background:#1D7A8C;color:#fff}
  .btn.ghost{background:transparent;border:1px solid #2C5470;color:#DCE9F2;margin-top:8px}
  .err{color:#FFB4A2;min-height:20px;font-size:.85rem;text-align:center}
  .muted{text-align:center;color:#9FB6C9;font-size:.75rem;margin-top:10px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .top a{color:#9FB6C9;text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<div class="card">
  <div class="top"><a href="/" id="homeLink">← Home</a><button id="langBtn" class="btn ghost" style="width:auto;padding:8px 12px;margin:0">EN</button></div>
  <div class="logo">🌍</div>
  <div class="title" id="title">ورود به حساب</div>
  <div class="sub" id="sub">برای استفاده از بخش علمی وارد شوید یا حساب بسازید.</div>
  <div class="tabs">
    <button id="tabLogin" class="on">ورود</button>
    <button id="tabRegister">ثبت‌نام</button>
    <button id="tabKey">کلید API</button>
  </div>
  <div id="authBox"></div>
  <p class="err" id="authErr"></p>
  <p class="muted" id="authHint"></p>
</div>
<script src="{% load static %}{% static 'core/auth.js' %}?v=2"></script>
</body>
</html>
