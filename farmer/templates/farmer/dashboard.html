{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#142B40">
<title>دستیار هوشمند کشاورز | Earth Intelligence</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{% static 'shared/tokens.css' %}?v=2">
<link rel="stylesheet" href="{% static 'farmer/farmer.css' %}?v=10">
</head>
<body>
<div id="offlineBanner" class="hidden" style="background:var(--ei-warning);color:#fff;text-align:center;padding:8px;font-size:.85rem">⚠️<span data-i18n="offline">آفلاین هستید — داده‌ها ممکن است به‌روز نباشد</span></div>
<div id="app">
  <!-- Onboarding -->
  <div id="onboard" class="onboard hidden">
    <div class="onboard-card ei-card">
      <div class="logo">🌾</div>
      <h1 data-i18n="agent_title">دستیار هوشمند کشاورز</h1>
      <p class="muted" data-i18n="app_sub">تصمیم‌گیری مبتنی بر داده واقعی NASA و FAO</p>
      <div id="authBox"></div>
      <p id="onboardErr" class="error"></p>
    </div>
  </div>

  <!-- Main shell -->
  <div id="main" class="hidden">
    <header class="ei-topbar">
      <div class="brand">
        <div class="brand-mark">🌾</div>
        <div>
          <div class="brand-name" data-i18n="agent_title">دستیار هوشمند کشاورز</div>
          <div class="brand-sub" id="farmerNameLabel"></div>
        </div>
      </div>
      <div class="ei-topbar-actions">
        <select id="fieldSelect" class="field-select" aria-label="انتخاب قطعه زمین" data-i18n-aria="select_field_aria"></select>
        <button id="modeBtn" class="ei-btn ei-btn-ghost" type="button" onclick="toggleMode()" style="padding:8px 12px"><span data-i18n="mode_expert">حرفه‌ای</span></button>
        <button id="logoutBtn" class="ei-btn ei-btn-ghost" type="button" data-i18n="logout">خروج</button>
        <button id="langBtn" class="ei-btn ei-btn-ghost" type="button" onclick="toggleFarmerLang()" aria-label="Language">EN</button>
        <button id="themeBtn" class="ei-btn ei-btn-ghost" type="button" aria-label="تغییر حالت روشن/تیره" data-i18n-aria="theme_aria">🌙</button>
      </div>
    </header>

    <div class="ei-shell">
      <aside class="ei-sidebar" aria-label="ناوبری اصلی" data-i18n-aria="side_nav_aria">
        <div class="ei-sidebar-label" data-i18n="side_workspace">فضای کاری</div>
        <p class="ei-sidebar-hint" data-i18n="side_hint">از اینجا بخش موردنیاز مزرعه را انتخاب کنید؛ توضیح هر بخش بالای صفحه نمایش داده می‌شود.</p>
        <button class="ei-nav-item active" data-tab="today"><span class="ico">🏠</span><span data-i18n="nav_today">امروز</span></button>
        <button class="ei-nav-item" data-tab="crop"><span class="ico">🌱</span><span data-i18n="nav_crops">محصول</span></button>
        <button class="ei-nav-item" data-tab="irrigation"><span class="ico">💧</span><span data-i18n="nav_irrigation">آبیاری</span></button>
        <button class="ei-nav-item" data-tab="calendar"><span class="ico">📅</span><span data-i18n="nav_calendar">تقویم</span></button>
        <button class="ei-nav-item" data-tab="risks"><span class="ico">⚠️</span><span data-i18n="nav_risks">هشدارها</span></button>
        <button class="ei-nav-item" data-tab="agent"><span class="ico">🤖</span><span data-i18n="nav_agent">دستیار</span></button>
        <button class="ei-nav-item" data-tab="economics"><span class="ico">💰</span><span data-i18n="nav_economics">اقتصاد</span></button>
        <button class="ei-nav-item" data-tab="manage"><span class="ico">⚙️</span><span data-i18n="nav_manage">مدیریت</span></button>
      </aside>

      <main class="ei-main" id="content" aria-live="polite" aria-busy="false"></main>
    </div>

    <nav class="ei-bottomnav" aria-label="ناوبری موبایل" data-i18n-aria="bottom_nav_aria">
      <button class="active" data-tab="today"><span>🏠</span><span data-i18n="nav_today">امروز</span></button>
      <button data-tab="crop"><span>🌱</span><span data-i18n="nav_crops">محصول</span></button>
      <button data-tab="irrigation"><span>💧</span><span data-i18n="nav_irrigation">آبیاری</span></button>
      <button data-tab="agent"><span>🤖</span><span data-i18n="nav_agent">دستیار</span></button>
      <button data-tab="manage"><span>☰</span><span data-i18n="nav_more">بیشتر</span></button>
    </nav>
  </div>
</div>
<script src="{% static 'farmer/i18n.js' %}?v=5"></script>
<script src="{% static 'farmer/farmer.js' %}?v=12"></script>
</body>
</html>
